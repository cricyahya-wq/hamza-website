services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moosepbx
      POSTGRES_PASSWORD: moosepbx
      POSTGRES_DB: moosepbx
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - moosepbx_postgres_data:/var/lib/postgresql/data

volumes:
  moosepbx_postgres_data:
